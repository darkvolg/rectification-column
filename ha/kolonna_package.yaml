kolonna_pkg:

  input_boolean:
    # голос раздельно по станциям (16.10: на втором этаже бывает не нужен).
    # Без initial — HA помнит, что выключено, и после перезапуска
    kolonna_voice_mini:
      name: "Колонна — голос на Станции Мини"
      icon: mdi:account-voice
    kolonna_voice_lite:
      name: "Колонна — голос на Яндекс Лайт"
      icon: mdi:account-voice
    # умные тревоги программы на ноуте (рост Пара, уход от точки, «Пар 2/3 растёт»,
    # «хвосты», вода). По умолчанию выключены — 16.10 на мёде орали весь день
    kolonna_smart:
      name: "Колонна — умные тревоги программы"
      icon: mdi:brain
    kolonna_alarms:
      name: "Колонна — тревоги по порогам"
      icon: mdi:alarm-light
      initial: true
    kolonna_alarm_active:
      name: "Колонна — тревога ждёт «Принял»"
      icon: mdi:bell-ring

  input_text:
    kolonna_alarm_text:
      name: "Колонна — последняя тревога"
      max: 255

  # фаза погона: тревоги по уходу Пара программа на ноуте даёт только на «Тело»,
  # при переключении на «Тело» сама запоминает точку отсчёта
  input_select:
    kolonna_faza:
      name: "Колонна — фаза"
      icon: mdi:flask-outline
      options:
        - Прогрев
        - Головы
        - Тело
        - Хвосты

  input_button:
    kolonna_ref:
      name: "Запомнить рабочий уровень Пара"
      icon: mdi:target
    kolonna_ack:
      name: "Принял тревогу"
      icon: mdi:check-bold

  input_number:
    kolonna_par_max:
      name: "Порог Пар"
      icon: mdi:thermometer-high
      min: 0
      max: 100
      step: 0.05
      mode: box
      unit_of_measurement: "°C"
    kolonna_par23_max:
      name: "Порог Пар 2/3"
      icon: mdi:thermometer-high
      min: 0
      max: 100
      step: 0.05
      mode: box
      unit_of_measurement: "°C"
    kolonna_voda_max:
      name: "Порог Вода"
      icon: mdi:water-thermometer
      min: 0
      max: 100
      step: 0.5
      mode: box
      unit_of_measurement: "°C"

  script:
    kolonna_say:
      alias: "Колонна — сказать"
      description: "Голос на станции, у которых включён переключатель"
      mode: queued
      max: 10
      fields:
        message:
          description: "Текст"
          example: "Пар пошёл вверх"
        voice:
          description: "Говорить на станциях (false = промолчать)"
          example: true
      sequence:
        - variables:
            st: >-
              {% set ns = namespace(l=[]) %}
              {% if is_state('input_boolean.kolonna_voice_mini', 'on') %}{% set ns.l = ns.l + ['media_player.yandex_station_m10tte210gm8rk'] %}{% endif %}
              {% if is_state('input_boolean.kolonna_voice_lite', 'on') %}{% set ns.l = ns.l + ['media_player.yandex_station_lp000000000000410757000093e582bb'] %}{% endif %}
              {{ ns.l }}
        - if:
            - condition: template
              value_template: "{{ (voice | default(true) | bool) and st | length > 0 }}"
          then:
            # на полную громкость, чтобы не прослушать, потом вернуть как было.
            # Свой возврат: встроенный extra.volume_level у yandex_station ждёт
            # состояние станции по локальной сети и здесь громкость не возвращал
            - variables:
                vols: >-
                  {% set ns = namespace(d={}) %}
                  {% for e in st %}
                    {% set v = state_attr(e, 'volume_level') %}
                    {% if v is number %}{% set ns.d = dict(ns.d, **{e: v}) %}{% endif %}
                  {% endfor %}
                  {{ ns.d }}
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: "{{ st }}"
              data:
                volume_level: 1
            - action: media_player.play_media
              continue_on_error: true
              target:
                entity_id: "{{ st }}"
              data:
                media_content_type: text
                media_content_id: "{{ message }}"
            # примерно 12 букв в секунду плюс запас на старт фразы
            - delay:
                seconds: "{{ (message | length / 12 + 4) | round(0) | int }}"
            - repeat:
                for_each: "{{ vols | dictsort }}"
                sequence:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: "{{ repeat.item[0] }}"
                    data:
                      volume_level: "{{ repeat.item[1] }}"

    kolonna_alarm:
      alias: "Колонна — тревога"
      description: "Сказать и повторять раз в минуту, пока не нажмут «Принял»"
      mode: queued
      max: 10
      fields:
        message:
          description: "Текст тревоги"
          example: "Пар ушёл вверх"
      sequence:
        - action: input_text.set_value
          target:
            entity_id: input_text.kolonna_alarm_text
          data:
            value: "{{ message[:255] }}"
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.kolonna_alarm_active
        - action: script.kolonna_say
          data:
            message: "{{ message }}"

  automation:
    - id: kolonna_threshold_cross
      alias: "Колонна — порог превышен"
      description: "Датчик колонны поднялся выше своего порога (порог 0 = выключен)"
      mode: queued
      triggers:
        - trigger: numeric_state
          entity_id: sensor.kolonna_par
          above: input_number.kolonna_par_max
          id: par
        - trigger: numeric_state
          entity_id: sensor.kolonna_par23
          above: input_number.kolonna_par23_max
          id: par23
        - trigger: numeric_state
          entity_id: sensor.kolonna_voda
          above: input_number.kolonna_voda_max
          id: voda
      conditions:
        - condition: state
          entity_id: input_boolean.kolonna_alarms
          state: "on"
        - condition: template
          value_template: "{{ states('input_number.kolonna_' ~ trigger.id ~ '_max') | float(0) > 0 }}"
      actions:
        - variables:
            names: {par: "Пар", par23: "Пар 2/3", voda: "Вода"}
            lim: "{{ states('input_number.kolonna_' ~ trigger.id ~ '_max') | float(0) }}"
            val: "{{ trigger.to_state.state | float(0) }}"
        - action: script.kolonna_alarm
          data:
            message: >-
              Внимание! {{ names[trigger.id] }} выше {{ (lim | round(2) | string).replace('.', ',') }}.
              Сейчас {{ (val | round(2) | string).replace('.', ',') }}.

    - id: kolonna_threshold_remind
      alias: "Колонна — порог, напоминание"
      description: "Пока датчик выше порога — напоминать раз в 5 минут"
      mode: single
      triggers:
        - trigger: time_pattern
          minutes: "/5"
      conditions:
        - condition: state
          entity_id: input_boolean.kolonna_alarms
          state: "on"
      actions:
        - variables:
            over: >-
              {% set ns = namespace(t=[]) %}
              {% for k, n in [('par','Пар'), ('par23','Пар 2/3'), ('voda','Вода')] %}
                {% set lim = states('input_number.kolonna_' ~ k ~ '_max') | float(0) %}
                {% set s = states.sensor['kolonna_' ~ k] %}
                {% if lim > 0 and s is not none and s.state | is_number
                      and s.state | float > lim
                      and (now() - s.last_reported).total_seconds() < 300 %}
                  {% set ns.t = ns.t + [n ~ ' ' ~ (s.state | float | round(2) | string).replace('.', ',')] %}
                {% endif %}
              {% endfor %}
              {{ ns.t | join(', ') }}
        - condition: template
          value_template: "{{ over | trim | length > 0 }}"
        - action: script.kolonna_say
          data:
            message: "Всё ещё выше порога: {{ over | trim }}."

    - id: kolonna_alarm_repeat
      alias: "Колонна — повтор тревоги до «Принял»"
      mode: single
      triggers:
        - trigger: time_pattern
          minutes: "/1"
      conditions:
        - condition: state
          entity_id: input_boolean.kolonna_alarm_active
          state: "on"
          for:
            seconds: 30
      actions:
        - action: script.kolonna_say
          data:
            message: >-
              Повторяю: {{ states('input_text.kolonna_alarm_text') }}
              Нажми «Принял» на странице колонны.

    - id: kolonna_alarm_ack
      alias: "Колонна — тревога принята"
      mode: single
      triggers:
        - trigger: state
          entity_id: input_button.kolonna_ack
      conditions:
        - condition: state
          entity_id: input_boolean.kolonna_alarm_active
          state: "on"
      actions:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.kolonna_alarm_active
        - action: script.kolonna_say
          data:
            message: "Принято."

    # сторож ноута: программа на ноуте раз в 30 с шлёт sensor.kolonna_status.
    # Посреди погона сигнал пропал на 3 минуты — завис ноут или упала программа.
    # «Лог молчит» программа объявляет сама; «ждёт» (погон закончен) — не тревожим
    - id: kolonna_watchdog
      alias: "Колонна — ноут не отвечает"
      mode: single
      triggers:
        - trigger: template
          value_template: >-
            {% set s = states.sensor.kolonna_status %}
            {{ s is not none and s.state in ['идёт', 'лог молчит']
               and (now() - s.last_reported).total_seconds() > 180 }}
      actions:
        - action: script.kolonna_alarm
          data:
            message: "Нет связи с ноутом колонны уже 3 минуты. Проверь ноут и программу."
