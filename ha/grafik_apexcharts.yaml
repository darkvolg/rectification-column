# ------------------------------------------------------------
#  3. ОХЛАЖДЕНИЕ
#     Вода греется на десятки градусов, дрожание тут не мешает.
#     Минимум в два градуса — просто чтобы график не сходил с ума,
#     пока вода не пущена.
