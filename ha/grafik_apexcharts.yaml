# ============================================================
#  Графики Home Assistant без «частокола»
# ============================================================
#
#  ЗАЧЕМ ЭТО НУЖНО
#
#  Встроенная карточка history-graph всегда подгоняет ось под данные и
#  никак это не настраивается. На спокойной колонне размах температуры —
#  одна ступень датчика, и карточка растягивает её на всю высоту: график
#  выглядит как непрерывные скачки, хотя не происходит ничего.
#
#  Ступень эта известна ровно: DS18B20 в 12 битах даёт 0.0625 °C, а
#  сглаживание в прошивке (окно 4) делит её на 0.015625 °C. Всё, что
#  меньше, — не движение колонны, а младший бит.
#
#  ApexCharts card умеет то, чего не умеет встроенная: МЯГКИЕ границы оси.
#  Тильда перед числом означает «начни отсюда, но раздвинься, если данные
#  выйдут за край». Это и есть минимальный размах — то же самое, что
#  сделано на странице графиков нашего пульта.
#
#  СОСТОЯНИЕ: НЕ ПРИМЕНЕНО, И ЭТО НАРОЧНО
#    12.09.2026 я это уже вставлял в живой дашборд и откатил обратно.
#    Причина простая и важная: физически подключён ОДИН датчик, кубовый.
#    Царга, отбор и вода дают N/A. Карточка «Верх колонны» получилась
#    пустой — без данных мягкие границы не работают вовсе, и ось
#    свалилась на 0..4 вместо 78..79. Вместо улучшения вышла дырка на
#    экране, а старая общая карточка хотя бы показывала живой куб.
#
#    ВЕРНУТЬСЯ К ЭТОМУ, КОГДА ЗАРАБОТАЮТ ЦАРГА И ОТБОР. Тогда разделение
#    станет не украшением, а необходимостью — см. следующий абзац.
#    Копия дашборда на всякий случай лежит в ha/backup/.
#
#  ПОЧЕМУ В ИТОГЕ ДВЕ КАРТОЧКИ, А НЕ ОДНА
#    Нынешняя общая карточка держит на ОДНОЙ оси все четыре датчика: куб
#    (идёт с 20 до 98 °C), царгу с отбором (около 78) и воду (около 30).
#    Пока жив один куб, это не мешает. Но как только пойдут остальные,
#    шкала растянется по самому размашистому каналу, и разница между
#    царгой и отбором — те десятые доли, по которым ловят фронт, —
#    схлопнется в одну линию. Величины разного масштаба не делят ось.
#
#  УСТАНОВКА С НУЛЯ (если повторяешь на другой системе)
#    HACS → Frontend → поиск «apexcharts-card» → установить → обновить
#    страницу с Ctrl+F5. Дальше вставить карточки ниже вместо history-graph.
#
#  Если ставить HACS не хочется — то же самое делается в Grafana
#  (он у тебя есть): в настройках оси Standard options → Soft min / Soft max.
# ============================================================

# ------------------------------------------------------------
#  1. ВЕРХ КОЛОННЫ — главный график погона
#     Царга и отбор. Именно здесь ловят фронт, и именно здесь
#     важно не принять дрожание за движение.
# ------------------------------------------------------------
type: custom:apexcharts-card
header:
  show: true
  title: Верх колонны
  show_states: true
  colorize_states: true
graph_span: 3h
# Точки берём как есть, без пересчёта в часовые средние: на погоне
# интересны минуты, а не часы.
span:
  end: minute
yaxis:
  - id: temp
    # Минимальный размах — один градус. Гистерезис, по которому ведут
    # тело, около 0.25 °C: на такой шкале он займёт четверть высоты,
    # это хорошо видно. А ступень 0.0156 °C превратится в волосок,
    # чем она и является.
    min: ~78
    max: ~79
    decimals: 2
    apex_config:
      tickAmount: 4
series:
  - entity: sensor.kolonna_t2_carga
    name: Царга 2/3
    yaxis_id: temp
    stroke_width: 2
    curve: straight
    extend_to: now
  - entity: sensor.kolonna_t3_otbor
    name: Отбор
    yaxis_id: temp
    stroke_width: 2
    curve: straight
    extend_to: now
apex_config:
  chart:
    height: 240
  legend:
    show: true
  tooltip:
    x:
      format: HH:mm:ss

# ------------------------------------------------------------
#  2. КУБ
#     Идёт с 20 до 98 °C, поэтому ось почти всегда широкая сама по
#     себе. Мягкие границы нужны только на холодной колонне, чтобы
#     до розжига не было того же частокола.
