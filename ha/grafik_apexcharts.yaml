# ============================================================
#  ЧЕГО ЭТО НЕ ЧИНИТ
#
#  Мягкие границы — про ПОКАЗ. Сами записи в базе Home Assistant как
#  сыпались от каждого дрожания младшего бита, так и сыплются: датчик
#  опрашивается раз в десять секунд, и почти каждый опрос — новое
#  состояние, то есть строка в базе. За сутки это порядка восьми с
#  половиной тысяч строк на один датчик, и хранится всё это пять суток
#  (recorder purge_keep_days).
#
#  Если захочется убрать и это — лечится в ПРОШИВКЕ, фильтром публикации
#  у каждого слота, после сглаживания:
#
#      filters:
#        - sliding_window_moving_average:
#            window_size: 4
#            send_every: 1
#        - or:
#            - delta: 0.02        # публикуем, если реально сдвинулось
#            - throttle: 60s      # и не реже раза в минуту, чтобы график жил
#
#  Плата от этого не глупеет: свой журнал она пишет раз в тридцать секунд
#  независимо от публикаций, а тренд царги считает по своему источнику.
#  Но учти цену: пульт тоже получает данные публикациями, и на спокойной
#  колонне плашки станут обновляться раз в минуту вместо каждых десяти
#  секунд. Пока железо не собрано целиком, я бы это не трогал.
# ============================================================
