number:
  - platform: template
    name: "SET Voda Max"
    id: set_voda_max
    optimistic: true
    restore_value: true
    initial_value: 55
    min_value: 40
    max_value: 75
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    entity_category: config

  - platform: template
    name: "SET Flow Min"
    id: set_flow_min
    optimistic: true
    restore_value: true
    initial_value: 0.3
    min_value: 0.1
    max_value: 2
    step: 0.05
    unit_of_measurement: "L/min"
    mode: box
    entity_category: config

  - platform: template
    name: "SET Kub Max"
    id: set_kub_max
    optimistic: true
    restore_value: true
    initial_value: 98.5
    min_value: 90
    max_value: 100
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    entity_category: config

  # Взвод аварии по протоку: ниже этой температуры куба протока
  # и не должно быть, поэтому сирену не поднимаем.
  - platform: template
    name: "SET Kub Arm"
    id: set_kub_arm
    optimistic: true
