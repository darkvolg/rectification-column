    mode: box
    entity_category: config


binary_sensor:

  # Главная авария: нет охлаждения → пары спирта пойдут в комнату
  - platform: template
    name: "ALARM Cooling"
    id: alm_cooling
    lambda: |-
      if (isnan(id(t_voda).state)) return {};
      float lim = id(set_voda_max).state;
      if (isnan(lim)) lim = 55.0;          // уставка не поднялась из NVS
      return id(t_voda).state > lim;
    filters:
      # Единственная авария, которая до сих пор срабатывала мгновенно.
      # У DS18B20 есть штатная гадость: пока конверсия не завершилась,
      # он отдаёт 85.0 °C — своё значение после сброса. Это выше любого
      # разумного порога по воде, и одного такого чтения хватало на сирену.
      # Окно сглаживания на 4 гасит одиночный выброс, но три подряд дают
      # уже 68 °C и проходят. Пятнадцать секунд закрывают вопрос и ничего
      # не стоят: перегрев охлаждения — процесс на минуты, не на секунды.
      - delayed_on: 15s
    on_press:
      - switch.turn_on: siren

  # Та же авария, но по протоку — срабатывает на минуты раньше температурной.
  # Вода ушла (шланг слетел, давление упало, кран закрыли) → турбинка встала
  # мгновенно, а вода в рубашке ещё какое-то время остаётся холодной,
  # и T4 об аварии не догадывается.
  #
  # Условие «куб горячее 50» отсекает ложняк на холодной колонне:
  # пока не греем — протока и не должно быть.
  - platform: template
    name: "ALARM No Flow"
    id: alm_flow
    lambda: |-
      if (isnan(id(t_kub).state) || isnan(id(water_flow).state)) return {};
      float arm = id(set_kub_arm).state;
      float lim = id(set_flow_min).state;
      if (isnan(arm)) arm = 50.0;
      if (isnan(lim)) lim = 0.3;
      return id(t_kub).state > arm && id(water_flow).state < lim;
    filters:
      - delayed_on: 20s     # переходные провалы давления не считаем аварией
    on_press:
      - switch.turn_on: siren

  # Куб дошёл до конца — тело кончилось
  - platform: template
    name: "ALARM Kub Hot"
    id: alm_kub
    lambda: |-
      if (isnan(id(t_kub).state)) return {};
      float lim = id(set_kub_max).state;
      if (isnan(lim)) lim = 98.5;
      return id(t_kub).state > lim;
    on_press:
      - switch.turn_on: siren

  # Приближение к захлёбу: расчётный порог Ø33 РПН ~1370 Вт,
  # уставка по умолчанию 1300 — правится в SET Pwr Warn
  - platform: template
    name: "WARN Power"
    id: warn_power
    lambda: |-
      if (isnan(id(power_calc).state)) return {};
      float lim = id(set_pwr_warn).state;
      if (isnan(lim)) lim = 1300.0;
      return id(power_calc).state > lim;

  # Фронт примесей тронулся: тренд на 2/3 пошёл вверх
  - platform: template
    name: "WARN Front"
    id: warn_front
    lambda: |-
      if (isnan(id(t_carga_trend).state)) return {};
      float lim = id(set_trend_warn).state;
      if (isnan(lim)) lim = 0.01;
      return id(t_carga_trend).state > lim;

  # Карта журнала. Не авария: без карты прибор работает, но архив
  # переживёт только до перезагрузки — про это надо знать заранее.
  - platform: template
    name: "SD Card"
    id: sd_card
    device_class: problem
    entity_category: diagnostic
    lambda: 'return !kolonna_log::card();'

  # Обрыв датчика
  - platform: template
    name: "ALARM Sensor Fault"
    id: alm_sensor
    lambda: |-
      // Обрыв — это когда роль НАЗНАЧЕНА на слот, а данных нет.
      // Неназначенная роль (выбрано «нет») — не неисправность, а честное
      // «датчик сюда ещё не поставлен». Иначе на пустом стенде авария
      // висела бы всегда и тянула за собой сирену, а постоянно орущая
      // сирена — это сирена, которую перестают слушать.
      // «Назначена» теперь значит «за ролью закреплён адрес датчика»,
      // а не «в списке выбран слот». Разница видна ровно в том случае,
      // ради которого всё и делалось: датчик сняли с шины — адрес
      // остался, данных нет, это и есть обрыв.
      auto broken = [](uint64_t addr, float v) {
        return addr != 0 && isnan(v);
      };
      // T5 здесь наравне с остальными. Раньше его не было, и пропажа
      // датчика воды на входе проходила молча — а на нём держится
      // мощность по воде, вторая независимая оценка нагрева. Потерять
      // её без предупреждения значит остаться с одной цифрой и считать,
      // что сверять больше не с чем.
      return broken(id(addr_kub),     id(t_kub).state)
          || broken(id(addr_carga),   id(t_carga).state)
          || broken(id(addr_otbor),   id(t_otbor).state)
          || broken(id(addr_voda),    id(t_voda).state)
          || broken(id(addr_voda_in), id(t_voda_in).state);
    filters:
      # Первые секунды после включения роли ещё пустые: назначение слотов
      # поднимается из NVS, датчики не опрошены. Без задержки плата на
      # каждой загрузке коротко орала бы сиреной на ровном месте.
      # 30 секунд заведомо перекрывают старт и ничего не стоят: настоящий
      # обрыв датчика полминуты подождёт, он не про секунды.
      - delayed_on: 30s
    on_press:
      - switch.turn_on: siren


# ============================================================
#  СИРЕНА — локальная, не зависит от сети
# ============================================================
# Решение о включении принимает сам ESP32. Роутер выключен, Home Assistant
# обновляется, интернет лёг — сирена всё равно орёт.
# Пуш в телефон идёт вторым каналом, а не вместо.

switch:
  - platform: gpio
    pin: GPIO23
    name: "Siren"
    id: siren
    restore_mode: ALWAYS_OFF     # после перезагрузки молчит, пока авария не повторится


# Кнопка квитирования — в общей секции button ниже.


# ============================================================
#  РАСЧЁТ ТРЕНДА
# ============================================================
# Окно 5 минут. При шаге датчика 0.0625 °C это позволяет разглядеть
# дрейф порядка 0.01 °C/мин — то, что в ручном журнале раз в полчаса
# не видно вообще.

globals:
  # Адрес датчика, назначенного на роль. Ноль — роль не назначена.
  # Живёт в NVS платы, поэтому переживает перезагрузку и перепрошивку.
  # Именно адрес, а не номер слота: слоты нумеруются по возрастанию
  # адресов, и новый датчик на шине сдвигает нумерацию.
  - id: addr_kub
    type: uint64_t
    restore_value: true
    initial_value: '0'
  - id: addr_carga
    type: uint64_t
    restore_value: true
    initial_value: '0'
  - id: addr_otbor
    type: uint64_t
    restore_value: true
    initial_value: '0'
  - id: addr_voda
    type: uint64_t
    restore_value: true
    initial_value: '0'
  - id: addr_voda_in
    type: uint64_t
    restore_value: true
    initial_value: '0'

  - id: t_prev
    type: float
    restore_value: false
    initial_value: '0'
  - id: trend_primed
    type: bool
    restore_value: false
    initial_value: 'false'

interval:
  # ---------- ЖУРНАЛ ПОГОНА ----------
  # Шаг 30 секунд: 1200 записей в памяти — это 10 часов, погон почти
  # целиком; на карте глубина не ограничена ничем.
  # Пишем плотно, а не раз в полчаса: шаг журнала — дело пульта, он
  # прореживает сам. Из плотного лога строится любой шаг, из редкого
  # плотный уже не восстановить.
  # Значения собираются здесь, потому что только тут известны id датчиков.
  - interval: 30s
    then:
      - lambda: |-
          float v[17] = {
            id(t_kub).state,          // 0  куб
            id(t_carga).state,        // 1  температура 2/3
            id(t_otbor).state,        // 2  температура отбора
            id(delta_t).state,        // 3  ΔT
            id(t_carga_trend).state,  // 4  скорость роста 2/3
            id(kub_abv).state,        // 5  спирт в кубе
            id(power_calc).state,     // 6  мощность по току
            id(power_water).state,    // 7  мощность по воде
            id(pzem_current).state,   // 8  ток
            id(pzem_voltage).state,   // 9  напряжение
            id(water_flow).state,     // 10 проток
            id(water_total).state,    // 11 расход воды
            id(t_voda).state,         // 12 вода выход
            id(t_voda_in).state,      // 13 вода вход
            id(atm_mmhg).state,       // 14 давление
            id(otbor_rate).state,     // 15 скорость отбора
            id(otbor_volume).state    // 16 отобрано
          };
          uint16_t al = 0;
          if (id(alm_flow).state)    al |= 1;
          if (id(alm_cooling).state) al |= 2;
          if (id(alm_kub).state)     al |= 4;
          if (id(alm_sensor).state)  al |= 8;
          if (id(warn_power).state)  al |= 16;
          if (id(warn_front).state)  al |= 32;

          uint32_t ts = 0;
          auto t = id(ha_time).now();
          if (!t.is_valid()) t = id(sntp_time).now();
          if (t.is_valid()) ts = t.timestamp;

          kolonna_log::push(ts, v, al);

  - interval: 300s
    then:
      - lambda: |-
          float t = id(t_carga).state;
          if (isnan(t)) return;
          if (!id(trend_primed)) {
            id(t_prev) = t;
            id(trend_primed) = true;
            return;
          }
          float d = (t - id(t_prev)) / 5.0f;   // °C за минуту
          id(t_prev) = t;
          id(t_carga_trend).publish_state(d);


# ============================================================
#  КНОПКИ
# ============================================================

button:
  # Квитирование сирены, как на нормальном щите: звук глушится,
  # но авария остаётся видимой на экране, пока причина не ушла.
  # Новая авария включит сирену заново.
  - platform: template
    name: "Ack Siren"
    id: btn_ack
    on_press:
      - switch.turn_off: siren

  # Очистка журнала. Жать перед новым погоном, иначе в файле окажутся
  # хвосты прошлого — а их потом примут за начало этого.
  - platform: template
    name: "Reset Log"
    id: btn_reset_log
    entity_category: config
    on_press:
      - lambda: 'kolonna_log::clear();'

  # Жать перед началом голов, а потом ещё раз перед телом
  - platform: template
    name: "Reset Otbor"
    id: btn_reset_drops
    on_press:
      - pulse_meter.set_total_pulses:
          id: drops
          value: 0

  - platform: template
    name: "Reset Energy"
    on_press:
      # Штатное действие компонента. Своя лямбда лезла в приватный метод
      # сенсора, которого у него нет.
      - pzemac.reset_energy: pzem

  # Обнулить счётчик литров перед погоном — потом видно расход воды за партию.
  # Это прямые деньги: вода + водоотведение 70 руб/м³.
  - platform: template
    name: "Reset Water"
    on_press:
      - pulse_meter.set_total_pulses:
          id: water_flow
          value: 0

  - platform: restart
    name: "Restart"


# ============================================================
#  ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ
# ============================================================
# Ни реле, ни симистора, ни клапана. P0 — только наблюдение.
# Управление появляется в P1 (клапан отбора) и P2 (мощность),
# и только после P3 (механическое реле в разрыв ТЭНа) колонну
# можно оставлять без присмотра.
#
# ⚠️ Датчик протока переехал сюда из P3, но это НЕ значит, что колонну
#    уже можно оставлять. Сейчас он только орёт сиреной. Уйти из дома
#    можно будет тогда, когда появится реле, которое по этой аварии
#    физически рвёт питание ТЭНа.
#
# Порядок в ACTION_PLAN_Автоматика.md нарушать не стоит: симистор
# пробивается в замкнутое состояние, и без механического реле
# автоматика способна выпарить куб досуха.
