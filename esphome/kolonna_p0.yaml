# Ректификационная колонна — P0 «прибор-наблюдатель»
# Версия прошивки 0.5.0
# Только измерение. Ничем не управляет.
# Схема подключения: ../P0_Сборка.md
#
# УСТАВКИ АВАРИЙ — в секции number: ниже, НЕ в лямбдах.
#   Крутятся с пульта (страница «Настройки»), из Home Assistant или
#   со своей страницы контроллера. Лежат в NVS (restore_value: true),
#   поэтому переживают перезагрузку и обесточивание.
#   Менять уставку перепрошивкой больше не нужно.
#
# ЖУРНАЛ ПОГОНА — внутри контроллера, файл kolonna_log.h.
#   Пишется раз в 30 с. Основное — карта, в памяти кольцо на 10 часов.
#   Работает при закрытом браузере и без всякого сервера.
#   Отдаётся страницами (у веб-сервера ESP-IDF нет потоковой выдачи):
#     /log.csv?from=<строка>&n=<сколько>   журнал из памяти
#     /logs.json                           что лежит на карте
#     /logs/<имя>?off=<байт>&len=<байт>    файл погона кусками
#     /logs                                тот же список глазами
#   Основное хранилище — microSD (CS 26, SCK 14, MOSI 13, MISO 27).
#   Все четыре линии — в ЛЕВОМ ряду платы, поэтому модуль ставится под
#   ESP32 и провода падают вниз без обходов. CS перенесён с GPIO5 на
#   GPIO26: GPIO5 в правом ряду (тянуть вокруг платы) и он strapping.
#   Без карты кольцо в памяти живёт 10 часов и стирается перезагрузкой.
#   Пульт забирает журнал сам: кнопка «Подтянуть» на странице журнала.
#
# ПЕРЕД ПЕРВОЙ ЗАЛИВКОЙ:
#   1. Вписать WiFi в secrets.yaml
#   2. !!! ВПИСАТЬ АДРЕСА DS18B20 !!!
#      Пока у всех пяти стоит заглушка 0x0000000000000000, ESPHome цепляет
#      ВСЕ пять сенсоров к ОДНОМУ физическому датчику: на экране пять
#      «живых» температур, а датчик один. Проверено 07.09.2026: все плашки
#      показывали 27.75, вода 27.8 — это то же число, просто у T4/T5
#      accuracy_decimals: 1, а у T1..T3 больше.
#      ЭТО ОПАСНО: автостоп по кубу 98.5 C и авария охлаждения сработают
#      от датчика, который физически не в кубе и не на воде.
#      Снять адреса (PowerShell, НЕ Git Bash — там ESPHome не собирается):
#         $env:ESPHOME_DATA_DIR = "C:/esphome_data"
#         esphome logs "C:/Users/Dark/Desktop/Проекты/Водочка/esphome/kolonna_p0.yaml"
#      В логах искать строки вида:
#         [dallas_temp] Found sensor 0x1c0000031edd2a28
#      Каждый адрес вписать вместо своей заглушки. Какой адрес где —
#      определять по поведению: зажать датчик в кулаке и смотреть,
#      чьё показание поехало вверх.
#   3. Калибровку счётчика капель сделать по процедуре из P0_Сборка.md
#   4. Калибровку YF-S201C (импульсы на литр) — там же
#
# РАСПИНОВКА:
#   GPIO4  — 1-Wire, все DS18B20 (подтяжка 4.7 кОм на 3.3 В)
#   GPIO21 — I2C SDA, BMP280
#   GPIO22 — I2C SCL, BMP280
#   GPIO16 — RX PZEM-004T (через делитель 1к/2к)
#   GPIO17 — TX PZEM-004T
#   GPIO18 — счётчик капель (модуль 2, пока свободен)
#   GPIO19 — YF-S201C, проток воды (через делитель 10к/20к)
#   GPIO23 — сирена через полевик
#   GPIO13 — microSD MOSI  (D13)
#   GPIO14 — microSD SCK   (D14)   все четыре — в ВЕРХНЕМ ряду платы,
#   GPIO27 — microSD MISO  (D27)   поэтому модуль ставится НАД ESP32
#   GPIO26 — microSD CS    (D26)
#
#   РЯДЫ ПЛАТЫ (DevKit 30 pin, положить USB влево, шелкографией вверх):
#   верхний ряд: VIN GND D13 D12 D14 D27 D26 D25 D33 D32 D35 D34 VN VP EN
#                — питание и microSD
#   нижний  ряд: 3V3 GND D15 D2 D4 RX2 TX2 D5 D18 D19 D21 RX0 TX0 D22 D23
#                — вся периферия колонны (RX2=GPIO16, TX2=GPIO17)
#
# ⚠️ Прошивать по USB ТОЛЬКО при отключённой от сети колонне.
#    TTL PZEM-004T не развязан от 220 В.
#
# ПОЧЕМУ НАЗВАНИЯ ЛАТИНИЦЕЙ:
#   ESPHome строит внутренние id из названия, вырезая всё, кроме латиницы и цифр.
#   С русскими названиями id превращаются в "sensor-t1___" и своя страница
#   с ними работать не сможет. Поэтому здесь латиница, а русские подписи
#   задаются в дашборде Home Assistant и на своей странице.

substitutions:
  device_name: kolonna
  friendly_name: "Kolonna"
  # Объём одной капли в мл. КАЛИБРУЕТСЯ: накапать 100 мл в мерный цилиндр,
  # поделить 100 на число капель. Обычно выходит 0.033–0.05.
  # Пересчитывать после каждой смены капельницы.
  ml_per_drop: "0.040"
  # Сопротивление ТЭНа, Ом. Паспортное: 220² / 3000 = 16.13.
  # УТОЧНЯЕТСЯ на калибровке: диммер на максимум (чистая синусоида,
  # PZEM меряет верно) → R = P / I².
  ten_resistance: "16.13"
  # Импульсов на литр у YF-S201C. Паспортное 450 (F = 7.5 · Q л/мин).
  # ОБЯЗАТЕЛЬНО КАЛИБРУЕТСЯ: пролить 5 л в ведро, поделить импульсы на литры.
  # Разброс между экземплярами до 10%, а от него зависит расчёт мощности по воде.
  pulses_per_liter: "450"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Журнал погона внутри контроллера. Переписан под ESP-IDF 08.09.2026:
  # карта поднимается через esp_vfs_fat_sdspi_mount, файлы отдаются
  # страницами — веб-сервер под IDF собирает ответ в памяти целиком.
  includes:
    - kolonna_log.h
    - kolonna_slots.h
  on_boot:
    priority: -100
    then:
      - lambda: 'kolonna_log::setup(id(web_base));'
      # Список слотов один на все лямбды, заполняется здесь: к этому
      # моменту 1-Wire уже опрошен и адреса у датчиков настоящие.
      - lambda: |-
          // Без «&»: id(датчик) в лямбде и так даёт указатель, а вот
          // id(глобальной) — саму переменную, поэтому ниже адрес берётся.
          kolonna_slots::all = {id(slot1), id(slot2), id(slot3),
                                id(slot4), id(slot5), id(slot6)};
      # Сводим две вещи: адрес, по которому роль реально работает, и
      # номер слота, который человек видит в списке.
      - lambda: |-
          // Именно select::Select, а не TemplateSelect: последний в
          // ESPHome 2026.8 — шаблон с параметрами, его имя так не написать.
          struct { esphome::select::Select *sel; uint64_t *addr; } R[] = {
            {id(sel_kub),    &id(addr_kub)},
            {id(sel_carga),  &id(addr_carga)},
            {id(sel_otbor),  &id(addr_otbor)},
            {id(sel_voda),   &id(addr_voda)},
            {id(sel_vhod),   &id(addr_voda_in)},
          };
          for (auto &r : R) {
            auto cur = r.sel->active_index();
            if (*r.addr == 0) {
              // Адреса ещё нет, а слот выбран — это или первый запуск с
              // заводским «Слот 1», или переезд со старой прошивки, где
              // роль хранила номер. Запоминаем адрес выбранного слота,
              // чтобы настройка человека не потерялась.
              if (cur.has_value() && cur.value() > 0)
                *r.addr = kolonna_slots::addr_by_index(cur.value());
              continue;
            }
            int n = kolonna_slots::slot_of(*r.addr);
            if (n < 0) continue;   // датчик пропал — номер в списке не трогаем
            if (!cur.has_value() || (int) cur.value() != n)
              r.sel->make_call().set_index((size_t) n).perform();
          }

esp32:
  board: esp32dev
  # Явно arduino: на нём работают AsyncWebServer (страница и /log.csv)
  # и библиотека SD для карты журнала.
  framework:
    type: arduino

logger:
  # Рабочий уровень. DEBUG нужен разово — снять адреса датчиков
  # («Found sensor 0x...» печатаются только на нём) — и вернуть обратно:
  # на DEBUG плата весь погон гоняет отладочный поток впустую.
  level: INFO
  logs:
    # PZEM ещё не подключён, но опрашивается: modbus каждые пять секунд
    # честно сообщает, что ответа нет — двенадцать предупреждений в минуту.
    # В таком логе не видно настоящих сообщений, а смотреть в него нужно
    # именно тогда, когда что-то пошло не так.
    # Опрос не выключаем: воткнут PZEM — заработает без пересборки.
    # Когда он появится, эти две строки надо снять, иначе так же молча
    # потеряются и его настоящие ошибки.
    modbus: ERROR
    modbus_controller: ERROR
    pzemac: ERROR

# Родной протокол Home Assistant. Быстрее и надёжнее MQTT, автообнаружение.
api:
  encryption:
    key: !secret api_encryption_key
  # 0 — НЕ перезагружаться, если Home Assistant не подключён.
  # По умолчанию ESPHome ребутит плату через 15 минут без клиента API.
  # Для дома с HA это разумно, для колонны без HA — катастрофа:
  # перезагрузка посреди погона, а с ней потеря журнала в памяти.
  # Прибор обязан работать сам по себе, HA — необязательная надстройка.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Колонна работает 10 часов. Потеря WiFi не должна ничего ронять.
  reboot_timeout: 0s
  # ESP32 по умолчанию дремлет между маячками роутера (modem sleep). Экономия
  # микроамперная — плата всё равно от сети, — а расплата заметная: пропущенный
  # маячок роняет соединение с Home Assistant на секунду. В истории это выглядит
  # как узкие пики: все сущности разом уходят в «недоступно» и тут же
  # возвращаются. Проверено 10.09.2026 — время работы платы при этом идёт
  # непрерывно, сигнал -50 дБм, то есть ни перезагрузки, ни слабого сигнала.
  power_save_mode: NONE
  # Мощность передатчика убавлена с максимальных 20 дБм. Причина не в
  # дальности — сигнал -52 дБм, роутер рядом, — а в питании: на передаче
  # ESP32 дёргает до 400 мА импульсами, и слабый источник или тонкий шнур
  # проседают ровно в этот момент. Плата не перезагружается, но пакет
  # теряется. Измерено 10.09.2026: до платы терялось 5-16% пингов, до
  # роутера и до Home Assistant по тому же воздуху — ноль.
  output_power: 15dB
  ap:
    ssid: "Kolonna Fallback"
    password: !secret ap_password

captive_portal:

# Веб-сервер на самом ESP32. Два применения:
#   1. http://kolonna.local — список датчиков живьём, работает даже если HA лёг
#   2. http://kolonna.local/events — поток данных для своей страницы (../web/index.html)
# Базовый веб-сервер объявлен отдельно, чтобы получить id: к нему
# цепляется обработчик /log.csv из kolonna_log.h
web_server_base:
  id: web_base

web_server:
  port: 80
  version: 3

# ============================================================
#  ВРЕМЯ
# ============================================================
# Нужно журналу: строка без метки времени бесполезна.
# Сначала спрашиваем Home Assistant (работает без интернета),
# если его нет — обычный SNTP.
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - logger.log: "время получено от Home Assistant"
  - platform: sntp
    id: sntp_time
    servers:
      - ru.pool.ntp.org
      - pool.ntp.org


# ============================================================
#  MQTT — ОПЦИЯ, по умолчанию выключено
# ============================================================
# Включать, если данные понадобятся не только Home Assistant:
# Node-RED, своя база, Grafana, скрипты, другие проекты.
#
# Работает ОДНОВРЕМЕННО с api: выше — одно другому не мешает.
#
# ⚠️ discovery: false обязательно! Иначе HA заведёт вторые копии всех
#    датчиков — одни по родному протоколу, другие по MQTT.
#
# Брокер: аддон Mosquitto в Home Assistant (Настройки → Дополнения).
#
# mqtt:
#   broker: 192.168.0.74
#   username: !secret mqtt_user
#   password: !secret mqtt_password
#   topic_prefix: kolonna
#   discovery: false
#   # Ретейн: последнее значение получит любой, кто подпишется позже
#   birth_message:
#     topic: kolonna/status
#     payload: online
#   will_message:
#     topic: kolonna/status
#     payload: offline


# ============================================================
#  ШИНЫ
# ============================================================

# 1-Wire для DS18B20 — GPIO4 + подтяжка 4.7 кОм на 3.3 В
one_wire:
  - platform: gpio
    pin: GPIO4
    id: ow_bus

# I2C для BMP280
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# UART до PZEM-004T v3 (Modbus RTU, 9600 8N1)
uart:
  id: uart_pzem
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1

modbus:
  uart_id: uart_pzem
  id: modbus_pzem


# ============================================================
#  ДАТЧИКИ
# ============================================================

sensor:

  # ---------- Мощность: главный смысл этапа P0 ----------
  # Заменяет врущий вольтметр. Показывал 90 В / 502 Вт при реальных ~120 В / ~900 Вт.
  #
  # ⚠️ ВАЖНО ПРО ПОДКЛЮЧЕНИЕ:
  #   Клеммы напряжения PZEM — ТОЛЬКО ДО диммера, на чистую сеть.
  #   Подключение после симистора выжигает входную цепь модуля (проверено
  #   на форуме: "с r11 пошёл дымок"). Кольцо CT — после диммера, на ТЭНе.
  #
  # ⚠️ ВАЖНО ПРО ПОКАЗАНИЯ:
  #   Поле power у PZEM при таком подключении ВРЁТ: он перемножает
  #   напряжение целой синусоиды на ток рубленой. Ошибка зависит от угла
  #   отсечки. Поэтому рабочая мощность берётся из Power Calc ниже.
  - platform: pzemac
    id: pzem
    modbus_id: modbus_pzem
    address: 0x01
    update_interval: 5s
    voltage:
      name: "Voltage"
      id: pzem_voltage
      accuracy_decimals: 1
    current:
      name: "Current"
      id: pzem_current
      accuracy_decimals: 2
    # Сырое поле PZEM. НЕ рабочее — оставлено для сравнения с Power Calc.
    # Расхождение между ними показывает, насколько сильно порезана синусоида.
    power:
      name: "Power Raw"
      id: pzem_power
      accuracy_decimals: 0
      filters:
        - exponential_moving_average:
            alpha: 0.3
            send_every: 1
    energy:
      name: "Energy"
      id: pzem_energy
    frequency:
      name: "Frequency"
      id: pzem_freq
    power_factor:
      name: "Power Factor"
      id: pzem_pf

  # ---------- РАБОЧАЯ МОЩНОСТЬ ----------
  # ТЭН — чисто активная нагрузка, значит P = I²·R верно ПРИ ЛЮБОЙ ФОРМЕ ТОКА.
  # Рубленая синусоида этой формуле не мешает. Нужен только честный
  # действующий ток (PZEM меряет его трансформатором) и известное R.
  #
  # Это обходит всю проблему с фазовой отсечкой: мы не меряем мощность,
  # мы её вычисляем.
  - platform: template
    name: "Power"
    id: power_calc
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (isnan(id(pzem_current).state)) return {};
      float i = id(pzem_current).state;
      return i * i * ${ten_resistance};

  # ---------- Температуры ----------
  # АДРЕСА: при первом запуске в логах появятся строки вида
  #   [dallas_temp:0xx] Found sensor 0x1c0000031edd2a28
  # Выписать четыре штуки и подставить сюда.
  #
  # Какой где: три датчика уже вмонтированы в колонну, поэтому определять
  # придётся по поведению. Проще всего на разгоне — куб поедет первым,
  # царга следом, вода последней. Либо отсоединять по одному и смотреть,
  # какой адрес пропал из логов.
  #
  # Поправки offset: на ХОЛОДНОЙ колонне перед разгоном все четыре обязаны
  # показывать одну комнатную температуру. Расхождение и есть поправка.
  #
  # resolution: 12 — шаг 0.0625 °C. На старой ардуинке было 10 бит (шаг 0.25),
  # поэтому медленный дрейф был не виден в принципе.

  # Единственный датчик, которого пока нет физически. Без него нет автостопа.
  # ================= СЛОТЫ: что физически висит на шине =================
  # Привязка по ПОЗИЦИИ на шине, а не по адресу. Поэтому прошивка не знает
  # заранее, какой датчик где стоит, и менять датчики можно без перепрошивки.
  # Как назначить: зажать датчик в кулаке, посмотреть, какой слот греется,
  # и выбрать этот слот в списке роли (секция select ниже, видна в вебе).
  #
  # ВАЖНО: позиции считаются по возрастанию адреса. Добавил или заменил
  # датчик — порядок может сдвинуться, роли надо переназначить. Это видно
  # сразу: показания роли уедут не туда. Перепрошивка при этом не нужна.
  - platform: dallas_temp
    one_wire_id: ow_bus
    index: 0
    name: "Slot 1"
    id: slot1
    resolution: 12
    update_interval: 10s
    accuracy_decimals: 3
    filters:
      # Скользящее среднее по четырём замерам (40 секунд). DS18B20 в 12 битах
      # шагает по 0.0625 °C, и когда температура стоит ровно между двумя
      # шагами, датчик честно скачет туда-сюда каждое измерение. На графике
      # с автомасштабом это выглядит как частокол прямоугольных импульсов
      # (проверено 10.09.2026: 88 смен значения на 90 точек, всё между
      # 24.0625 и 24.125). Усреднение превращает эти прыжки в плавную линию
      # и не мешает: тепловые процессы в колонне идут минутами, а не
      # секундами, задержка в полминуты роли не играет.
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
      - offset: 0.0          # поправка конкретного датчика, снимается в стакане воды

  - platform: dallas_temp
    one_wire_id: ow_bus
    index: 1
    name: "Slot 2"
    id: slot2
    resolution: 12
    update_interval: 10s
    accuracy_decimals: 3
    filters:
      # Скользящее среднее по четырём замерам (40 секунд). DS18B20 в 12 битах
      # шагает по 0.0625 °C, и когда температура стоит ровно между двумя
      # шагами, датчик честно скачет туда-сюда каждое измерение. На графике
      # с автомасштабом это выглядит как частокол прямоугольных импульсов
      # (проверено 10.09.2026: 88 смен значения на 90 точек, всё между
      # 24.0625 и 24.125). Усреднение превращает эти прыжки в плавную линию
      # и не мешает: тепловые процессы в колонне идут минутами, а не
      # секундами, задержка в полминуты роли не играет.
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
      - offset: 0.0          # поправка конкретного датчика, снимается в стакане воды

  - platform: dallas_temp
    one_wire_id: ow_bus
    index: 2
    name: "Slot 3"
    id: slot3
    resolution: 12
    update_interval: 10s
    accuracy_decimals: 3
    filters:
      # Скользящее среднее по четырём замерам (40 секунд). DS18B20 в 12 битах
      # шагает по 0.0625 °C, и когда температура стоит ровно между двумя
      # шагами, датчик честно скачет туда-сюда каждое измерение. На графике
      # с автомасштабом это выглядит как частокол прямоугольных импульсов
      # (проверено 10.09.2026: 88 смен значения на 90 точек, всё между
      # 24.0625 и 24.125). Усреднение превращает эти прыжки в плавную линию
      # и не мешает: тепловые процессы в колонне идут минутами, а не
      # секундами, задержка в полминуты роли не играет.
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
      - offset: 0.0          # поправка конкретного датчика, снимается в стакане воды

  - platform: dallas_temp
    one_wire_id: ow_bus
    index: 3
    name: "Slot 4"
    id: slot4
    resolution: 12
    update_interval: 10s
    accuracy_decimals: 3
    filters:
      # Скользящее среднее по четырём замерам (40 секунд). DS18B20 в 12 битах
      # шагает по 0.0625 °C, и когда температура стоит ровно между двумя
      # шагами, датчик честно скачет туда-сюда каждое измерение. На графике
