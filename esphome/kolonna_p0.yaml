          send_every: 1
      - offset: 0.0          # поправка конкретного датчика, снимается в стакане воды

  - platform: dallas_temp
    one_wire_id: ow_bus
    index: 5
    name: "Slot 6"
    id: slot6
    resolution: 12
    update_interval: 10s
    accuracy_decimals: 3
    filters:
      # Скользящее среднее по четырём замерам (40 секунд). DS18B20 в 12 битах
      # шагает по 0.0625 °C, и когда температура стоит ровно между двумя
      # шагами, датчик честно скачет туда-сюда каждое измерение. На графике
      # с автомасштабом это выглядит как частокол прямоугольных импульсов
      # (проверено 10.09.2026: 88 смен значения на 90 точек, всё между
      # 24.0625 и 24.125). Усреднение превращает эти прыжки в плавную линию
      # и не мешает: тепловые процессы в колонне идут минутами, а не
      # секундами, задержка в полминуты роли не играет.
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
      - offset: 0.0          # поправка конкретного датчика, снимается в стакане воды

  # ================= РОЛИ: что этот датчик значит для колонны =================
  # Значение берётся из слота, выбранного в списке. «нет» -> роль пустая,
  # и все аварии по ней молчат (в лямбдах стоят проверки isnan).
  - platform: template
    name: "T1 Kub"
    id: t_kub
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      // Роль привязана к АДРЕСУ датчика, а не к его месту на шине:
      // зачем так и чем это грозит иначе — в kolonna_slots.h.
      // Датчик пропал с шины — NAN, а не показания соседнего.
      return kolonna_slots::by_addr(id(addr_kub));

  - platform: template
    name: "T2 Carga"
    id: t_carga
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      // Роль привязана к АДРЕСУ датчика, а не к его месту на шине:
      // зачем так и чем это грозит иначе — в kolonna_slots.h.
      // Датчик пропал с шины — NAN, а не показания соседнего.
      return kolonna_slots::by_addr(id(addr_carga));

  - platform: template
    name: "T3 Otbor"
    id: t_otbor
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      // Роль привязана к АДРЕСУ датчика, а не к его месту на шине:
      // зачем так и чем это грозит иначе — в kolonna_slots.h.
      // Датчик пропал с шины — NAN, а не показания соседнего.
      return kolonna_slots::by_addr(id(addr_otbor));

  - platform: template
    name: "T4 Voda"
    id: t_voda
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      // Роль привязана к АДРЕСУ датчика, а не к его месту на шине:
      // зачем так и чем это грозит иначе — в kolonna_slots.h.
      // Датчик пропал с шины — NAN, а не показания соседнего.
      return kolonna_slots::by_addr(id(addr_voda));

  - platform: template
    name: "T5 Voda Vhod"
    id: t_voda_in
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      // Роль привязана к АДРЕСУ датчика, а не к его месту на шине:
      // зачем так и чем это грозит иначе — в kolonna_slots.h.
      // Датчик пропал с шины — NAN, а не показания соседнего.
      return kolonna_slots::by_addr(id(addr_voda_in));

  # ---------- Проток охлаждающей воды: YF-S201C ----------
  # Турбинка с датчиком Холла. Ставится на ХОЛОДНЫЙ ВХОД, до дефлегматора.
  #
  # Зачем на входе, а не на выходе:
  #   • корпус пластиковый, холодная вода его не старит;
  #   • на выходе вода горячая и с пузырями — турбинка считает мусор;
  #   • на входе стабильное давление водопровода.
  #
  # ⚠️ Выход датчика — 5 В. Напрямую в GPIO нельзя, нужен делитель.
  #    Схема в P0_Сборка.md, раздел «Датчик протока».
  - platform: pulse_meter
    pin:
      number: GPIO19
      mode:
        input: true
    name: "Water Flow"
    id: water_flow
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    # При 30 л/мин период импульса 4.4 мс, так что 2 мс не срежут максимум
    internal_filter: 2ms
    # Вода встала → через 5 с ноль, а не последнее значение. От этого
    # зависит скорость срабатывания аварии.
    timeout: 5s
    filters:
      - lambda: return x / ${pulses_per_liter};
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1
    total:
      name: "Water Total"
      id: water_total
      unit_of_measurement: "L"
      accuracy_decimals: 1
      filters:
        - lambda: return x / ${pulses_per_liter};

  # ---------- ВТОРАЯ, НЕЗАВИСИМАЯ МОЩНОСТЬ ----------
  # Тепловой баланс: почти всё, что даёт ТЭН, уносит охлаждающая вода.
  #   P [Вт] = Q [л/мин] · ΔT [°C] · 69.77
  # (69.77 = 4186 Дж/(кг·К) / 60 с)
  #
  # Считает мощность БЕЗ PZEM — только по расходу и разности температур воды.
  # Это независимая проверка: если Power и Power Water сходятся в пределах
  # 10-15%, обеим можно верить. Расходятся — врёт либо R ТЭНа, либо
  # калибровка импульсов на литр.
  #
  # Показания на 5-10% ниже электрической мощности — это норма: часть тепла
  # уходит через изоляцию колонны и с самим отбором.
  - platform: template
    name: "Power Water"
    id: power_water
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(water_flow).state) || isnan(id(t_voda).state)
          || isnan(id(t_voda_in).state)) return {};
      float dt = id(t_voda).state - id(t_voda_in).state;
      if (dt <= 0.0f) return 0.0f;
      return id(water_flow).state * dt * 69.77f;

  # ---------- Производные: ловят фронт раньше абсолютной температуры ----------

  # Разность верх − 2/3. Не зависит от погоды: обе точки плывут вместе с давлением.
  - platform: template
    name: "Delta T"
    id: delta_t
    unit_of_measurement: "°C"
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (isnan(id(t_otbor).state) || isnan(id(t_carga).state)) return {};
      return id(t_otbor).state - id(t_carga).state;

  # Скорость роста T на 2/3 за окно 5 минут. Ловит фронт за 20–30 минут до того,
  # как абсолютная температура сдвинется на заметную величину.
  - platform: template
    name: "Trend T2"
    id: t_carga_trend
    unit_of_measurement: "°C/min"
    accuracy_decimals: 3
    update_interval: never
    filters:
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1

  # ---------- Журнал ----------
  # Строк на карте. Ноль при живом Log Rows означает, что карты нет
  # или её выдернули: журнал есть только в памяти и умрёт с перезагрузкой.
  - platform: template
    name: "Log Rows SD"
    id: log_rows_sd
    unit_of_measurement: "зап."
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return (float) kolonna_log::rows_sd();'

  # Видно со страницы и из Home Assistant: пишется ли вообще.
  - platform: template
    name: "Log Rows"
    id: log_rows
    unit_of_measurement: "зап."
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return (float) kolonna_log::rows();'

  # ---------- Атмосферное давление ----------
  # Т кипения плывёт ~0.037 °C на 1 мм рт.ст. Без этого смена погоды
  # выглядит как приход хвостов.
  - platform: bmp085
    # У юзера физически BMP180 (написано на модуле), а не BMP280.
    # BMP180 и BMP085 — один драйвер, адрес жёстко 0x77, менять нельзя.
    # Проверено 07.09.2026: i2c-скан нашёл 0x77, а bmp280 ответил
    # «Wrong chip ID» (BMP280 = 0x58, BMP180 = 0x55).
    # Точность BMP180 ±1 гПа против ±0.12 у BMP280. Для поправки температуры
    # кипения это не важно: 1 гПа = 0.75 мм рт.ст. = 0.028 C поправки.
    temperature:
      name: "Box Temp"
      id: box_temp
      accuracy_decimals: 1
    pressure:
      name: "Pressure hPa"
      id: atm_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 1
      filters:
        - exponential_moving_average:
            alpha: 0.1
            send_every: 1
    update_interval: 60s

  - platform: template
    name: "Pressure mmHg"
    id: atm_mmhg
    unit_of_measurement: "mmHg"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (isnan(id(atm_pressure).state)) return {};
      return id(atm_pressure).state / 1.333224f;

  - platform: template
    name: "T Boil Correction"
    id: t_correction
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      if (isnan(id(atm_mmhg).state)) return {};
      // Отклонение от 760 мм рт.ст., 0.037 °C на мм
      return (id(atm_mmhg).state - 760.0f) * 0.037f;

  # ---------- Спиртуозность кубовой жидкости ----------
  # Идея подсмотрена у серийного АРД-403PROFI: по температуре кипения
  # кубовой жидкости из таблицы равновесия вода-этанол считается, сколько
  # спирта ещё осталось. Куб за погон едет с 78 до 100 °C, и эта цифра
  # прямо говорит, сколько ещё гнать — в отличие от самой температуры,
  # которую надо держать в голове вместе с таблицей.
  #
  # ⚠️ Это РАСЧЁТ, а не измерение. Точность зависит от давления (учтено)
  #    и от того, что датчик стоит в бобышке, а не в толще жидкости.
  #    На первом погоне сверить с ареометром.
  - platform: template
    name: "Kub ABV"
    id: kub_abv
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (isnan(id(t_kub).state)) return {};
      float t = id(t_kub).state;
      if (!isnan(id(atm_mmhg).state)) t -= (id(atm_mmhg).state - 760.0f) * 0.037f;
      // Куб холодный — крепость по температуре не считается вообще:
      // смесь не кипит, равновесия пар-жидкость нет, переводить нечего.
      // Раньше всё, что ниже 78.15, упиралось в нижний край таблицы и
      // возвращало 96 %: холодный куб выглядел готовым ректификатом
      // в журнале, на графиках и в Home Assistant. Поймано 08.09.2026,
      // в логе платы стояло «26,38 °C; 96,0 %».
      if (t < 70.0f) return {};
      static const float T[16] = {100.0f, 95.5f, 92.0f, 89.5f, 87.5f, 86.0f,
                                  85.0f, 84.0f, 83.1f, 82.5f, 82.0f, 81.0f,
                                  80.2f, 79.3f, 78.5f, 78.15f};
      static const float A[16] = {0, 5, 10, 15, 20, 25, 30, 35,
                                  40, 45, 50, 60, 70, 80, 90, 96};
      if (t >= T[0])  return 0.0f;
      if (t <= T[15]) return 96.0f;
      for (int i = 0; i < 15; i++) {
        if (t <= T[i] && t >= T[i + 1])
          return A[i] + (T[i] - t) / (T[i] - T[i + 1]) * (A[i + 1] - A[i]);
      }
      return {};

  # ---------- Счётчик капель ----------
  # Оптопара на капельной камере в линии отбора.
  # На голове 120 мл/ч это примерно 1 капля в секунду, на теле — 7–8.
  - platform: pulse_meter
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    name: "Drops per min"
    id: drops
    unit_of_measurement: "drop/min"
    accuracy_decimals: 0
    # Отсекает дребезг фронта. Мало — считает одну каплю дважды,
    # много — пропускает капли на теле. 20 мс держит до 50 капель/с.
    internal_filter: 20ms
    # Клапан закрыт → через 3 минуты покажет ноль, а не последнее значение
    timeout: 3min
    filters:
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1
    total:
      name: "Drops Total"
      id: drops_total
      accuracy_decimals: 0

  # Главное рабочее число: держим 120 мл/ч на голове, 1100 на теле
  - platform: template
    name: "Otbor Rate"
    id: otbor_rate
    unit_of_measurement: "ml/h"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(drops).state)) return {};
      return id(drops).state * ${ml_per_drop} * 60.0f;

  # Сколько уже взято. Головы = 400 мл, дальше переход на тело.
  - platform: template
    name: "Otbor Volume"
    id: otbor_volume
    unit_of_measurement: "ml"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(drops_total).state)) return {};
      return id(drops_total).state * ${ml_per_drop};

  - platform: uptime
    name: "Uptime"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s


# ============================================================
#  ОТКЛОНЕНИЯ — для дашборда в стиле ISA-101
# ============================================================
# Экран остаётся серым, пока всё в норме. Цвет появляется только здесь.
# На P0 это только индикация — управления нет, реле нет.

# ============================================================
#  УСТАВКИ АВАРИЙ
# ============================================================
# Почему number, а не константы в лямбдах: уставку хочется поправить
# по ходу погона, а не в 2 часа ночи через перепрошивку. Значения
# лежат в NVS и переживают перезагрузку.
#
# Границы min/max выбраны так, чтобы нельзя было случайно отключить
# защиту: воду на выходе не задать выше 75 °C, проток — ниже 0.1 л/мин.
# Уставка, которую можно увести в бесконечность, защитой не является.

# ============================================================
#  НАЗНАЧЕНИЕ ДАТЧИКОВ — из веб-интерфейса, без перепрошивки
# ============================================================
# Выбор сохраняется в NVS и переживает перезагрузку и обесточивание.
# ============================================================
#  КУДА ПРИВЯЗАНА КАЖДАЯ РОЛЬ
# ============================================================
# Роль хранит адрес датчика (см. kolonna_slots.h). Здесь это видно
# человеку: на каком слоте её датчик сейчас — и жив ли он вообще.
# «ПРОПАЛ» значит, что датчик был назначен, а на шине его нет:
# обрыв, отвалившаяся клемма, замена. Показания роли при этом пустые.
text_sensor:
  - platform: template
    name: "BIND T1 Kub"
    id: bind_kub
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return kolonna_slots::status(id(addr_kub));'

  - platform: template
    name: "BIND T2 Carga"
    id: bind_carga
    entity_category: diagnostic
    update_interval: 30s
    lambda: 'return kolonna_slots::status(id(addr_carga));'

  - platform: template
    name: "BIND T3 Otbor"
    id: bind_otbor
    entity_category: diagnostic
    update_interval: 30s
